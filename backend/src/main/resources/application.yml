spring:
  application:
    name: fersa-care-backend
  datasource:
    url: ${SUPABASE_DB_URL}            # ex: jdbc:postgresql://db.<ref>.supabase.co:5432/postgres
    username: ${SUPABASE_DB_USER}      # ex: postgres
    password: ${SUPABASE_DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      # Upload de manuais em PDF (área admin)
      max-file-size: ${FERSA_UPLOAD_MAX:25MB}
      max-request-size: ${FERSA_UPLOAD_MAX:25MB}

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health

# Configuração própria do FERSA Care — nada aqui é lido pelo Spring
# automaticamente; é o nosso SecurityConfig que injeta estes valores.
fersa:
  supabase:
    # JWKS do projeto Supabase: https://<project-ref>.supabase.co/auth/v1/jwks
    jwks-url: ${SUPABASE_JWKS_URL}
    # Emissor esperado no token: https://<project-ref>.supabase.co/auth/v1
    issuer: ${SUPABASE_JWT_ISSUER}
  cors:
    # Separado por vírgula. Em dev: a origem do Live Server do Web.
    allowed-origins: ${FERSA_CORS_ORIGINS:http://127.0.0.1:5500,http://localhost:5500}
  gemini:
    # Chave em https://aistudio.google.com/apikey — só no .env, nunca no Git.
    api-key: ${GEMINI_API_KEY:}
    base-url: https://generativelanguage.googleapis.com/v1beta
    modelo-embedding: ${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
    # Precisa bater com vector(768) em database/manuais.sql
    embedding-dimensoes: 768
    modelo-chat: ${GEMINI_CHAT_MODEL:gemini-2.5-flash}
  rag:
    # Quantos trechos vão para o prompt
    top-k: 5
    # Tamanho de cada chunk (em caracteres) e quanto um chunk repete do anterior
    chunk-tamanho: 1200
    chunk-sobreposicao: 200
    # Similaridade mínima (0 a 1) para um trecho entrar no prompt.
    # 0 = desligado; ajustar na semana 4 olhando os scores das 10 perguntas de teste.
    score-minimo: ${FERSA_RAG_SCORE_MINIMO:0}
